# sciml-rs GPU environment (Phase 9 T2 onward): NCCL built against the CUDA the driver
# supports. Driver 610.57 tops out at CUDA 13.3; /usr/local/cuda (13.5) and the system
# libnccl (2.32.3+cuda13.4) are above it.
spack:
  specs:
  - nccl cuda_arch=80 fabrics=none  # one node, two GPUs over PCIe: no InfiniBand
  - gnuplot+cairo~gd~libcerf~qt~wx~readline  # pngcairo, for plots.png and the plot examples
  packages:
    flex:
      externals:
      - spec: flex@2.6.4+lex
        prefix: /usr
    autoconf:
      externals:
      - spec: autoconf@2.69
        prefix: /usr
    file:
      externals:
      - spec: file@5.39
        prefix: /usr
    bzip2:
      externals:
      - spec: bzip2@1.0.8
        prefix: /usr
    gettext:
      externals:
      - spec: gettext@0.21
        prefix: /usr
    m4:
      externals:
      - spec: m4@1.4.19
        prefix: /usr
    automake:
      externals:
      - spec: automake@1.16.2
        prefix: /usr
    meson:
      externals:
      - spec: meson@0.63.3
        prefix: /usr
    gmake:
      externals:
      - spec: gmake@4.3
        prefix: /usr
    pkgconf:
      externals:
      - spec: pkgconf@1.7.3
        prefix: /usr
    curl:
      externals:
      - spec: curl@7.76.1+gssapi+ldap+nghttp2
        prefix: /usr
    openssl:
      externals:
      - spec: openssl@3.2.2
        prefix: /usr
    libtool:
      externals:
      - spec: libtool@2.4.6
        prefix: /usr
    cmake:
      externals:
      - spec: cmake@3.26.5
        prefix: /usr
    tar:
      externals:
      - spec: tar@1.34
        prefix: /usr
    xz:
      externals:
      - spec: xz@5.2.5
        prefix: /usr
    findutils:
      externals:
      - spec: findutils@4.8.0
        prefix: /usr
    bison:
      externals:
      - spec: bison@3.7.4
        prefix: /usr
    diffutils:
      externals:
      - spec: diffutils@3.7
        prefix: /usr
    ninja:
      externals:
      - spec: ninja@1.10.2
        prefix: /usr
    python:
      externals:
      - spec: python@3.9.21+bz2+crypt+ctypes+curses+dbm+lzma+pyexpat+pythoncmd+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
        prefix: /usr
    perl:
      externals:
      - spec: perl@5.32.1~cpanm~opcode+open+shared+threads
        prefix: /usr
      buildable: false
    cuda:
      externals:
      - spec: cuda@12.6.85
        prefix: /usr/local/cuda-12.6
      buildable: false
  concretizer:
    unify: true
  view: true
