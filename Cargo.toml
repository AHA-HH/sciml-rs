[package]
name = "sciml-rs"
version = "0.1.0-dev"
authors = ["The sciml-rs developers"]
edition = "2024"
description = "Scientific machine learning tools in Rust"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/AHA-HH/sciml-rs"
repository = "https://github.com/AHA-HH/sciml-rs.git"
readme = "README.md"
keywords = ["neural operators"]
categories = ["science", "algorithms"]

[lib]
name = "sciml_rs"

[[example]]
name = "train_burgers"
path = "examples/train/burgers.rs"

[[example]]
name = "train_burgers_learner"
path = "examples/train/burgers_learner.rs"

[[example]]
name = "train_darcy"
path = "examples/train/darcy.rs"

[[example]]
name = "train_poisson"
path = "examples/train/poisson.rs"

[[example]]
name = "predict_burgers"
path = "examples/predict/burgers.rs"

[[example]]
name = "predict_darcy"
path = "examples/predict/darcy.rs"

[[example]]
name = "predict_poisson"
path = "examples/predict/poisson.rs"

[[example]]
name = "burgers_resolution"
path = "examples/predict/burgers_resolution.rs"

[[example]]
name = "darcy_plot"
path = "examples/predict/darcy_plot.rs"

[[example]]
name = "poisson_plot"
path = "examples/predict/poisson_plot.rs"

[[example]]
name = "poisson_resolution"
path = "examples/predict/poisson_resolution.rs"

[[example]]
name = "poisson_matrix"
path = "examples/predict/poisson_matrix.rs"

[[example]]
name = "poisson_pod"
path = "examples/predict/poisson_pod.rs"
required-features = ["datagen"]

[[example]]
name = "generate_poisson"
path = "examples/generate/poisson.rs"
required-features = ["datagen"]

# Backends are additive: `Device::default()` picks the highest-priority one
# compiled in (CUDA > Metal > ROCm > Vulkan > wgpu > Flex), and the
# `BURN_DEVICE` env var overrides it at runtime. NdArray is not offered: Burn's
# FFT extension (burn-signal) does not support it. ROCm and Vulkan are not offered
# either: there is no hardware to test them on.
[features]
default = ["flex"]
flex = ["burn/flex"] # pure-Rust CPU
metal = ["burn/metal"]
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]
# `datagen`: everything needed to generate and check the Poisson datasets (the reference
# solvers in `pde/`, the D and D² they use, and `generate_poisson`; design §12, decision
# 27).
# RLST (dense and sparse linear algebra for the Chebyshev reference solver) plus a
# BLAS/LAPACK provider chosen by target: Accelerate on macOS, system OpenBLAS on Linux.
# rlst's `fftw` and `fftw_system` back its Chebyshev transforms (design decision 12).
# FFTW is GPL-2.0+; it comes from the system libfftw3 via pkg-config and is linked only
# into builds with this feature. No other rlst feature is enabled (no burn or MPI).
# The Poisson dataset generator also needs the GRF RNG (`rand_chacha`'s ChaCha8Rng, a
# default dependency since Phase 7 T1, and `rand_distr`'s StandardNormal) and `serde_json`
# for its sidecars; all three are pinned exactly so a seed gives the same field on every
# machine, even in builds that do not use the committed `Cargo.lock` (design §12,
# decision 13).
datagen = [
    "dep:rlst",
    "rlst/fftw",
    "rlst/fftw_system",
    "dep:blas-src",
    "dep:lapack-src",
    "dep:openblas-src",
    "dep:rand_distr",
    "dep:serde_json",
]

# The crate is the only default member, so root `cargo test` / `clippy` / `doc` build only
# it. `spikes/metal_diag` and `spikes/transfer_floor` share this lock, target directory and
# Burn pin; the other spikes are standalone (their own `[workspace]`).
[workspace]
members = [".", "spikes/metal_diag", "spikes/transfer_floor"]
default-members = ["."]

[workspace.dependencies]
burn = { git = "https://github.com/ax1s-x1zz/burn", rev = "ddfa9af03ab9fb4b8491889e55c9d0ceffbfda22", features = ["autodiff", "signal", "store", "train"] }

[dependencies]
burn.workspace = true
ndarray = "0.17"
ndarray-npy = "0.10"
matfile = "0.5"
gnuplot = "0.0.46"
rlst = { version = "0.9", optional = true, default-features = false }
# Bumping rand_chacha or rand_distr changes the dataset format: update `grf::RNG` too.
# rand_chacha also draws the Phase 7 training subsets (`loaders::poisson::subset`), so a
# bump changes those too.
rand_chacha = "=0.10.0"
rand_distr = { version = "=0.6.0", optional = true }
serde_json = { version = "=1.0.151", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.14", features = ["accelerate"], optional = true }
lapack-src = { version = "0.13", features = ["accelerate"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
blas-src = { version = "0.14", features = ["openblas"], optional = true }
lapack-src = { version = "0.13", features = ["openblas"], optional = true }
openblas-src = { version = "0.10", features = ["system"], optional = true }

[dev-dependencies]
approx = { version = "0.5", features = ["num-complex"] }
