[project]
name = "sciml-rs-parity"
version = "0.1.0"
description = "Fixture generator for output parity against neuraloperator 2.0.0 (outside CI)"
requires-python = "==3.12.*"
# Exact pins: the tag's own pin where it gives one (torch-harmonics, its `doc` extra),
# otherwise the last release before the tag's commit date, 2025-10-22. uv.lock pins the rest.
dependencies = [
    "neuraloperator==2.0.0",
    "torch==2.9.0",
    "tensorly==0.9.0",
    "tensorly-torch==0.5.0",
    "torch-harmonics==0.7.4",
    "numpy==2.3.4",
]

[tool.uv]
package = false
