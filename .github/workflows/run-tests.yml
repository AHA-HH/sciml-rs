name: 🧪 run-tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the Rust jobs run. They are required checks on `main`, so they must
  # always report: a job skipped by its `if` reports success, while a workflow filtered
  # out by `on: paths` would never report and block the merge. Pushes to `main` and manual
  # runs always run everything; a pull request runs the Rust jobs only when it changes
  # something they build or test (docs/CONVENTIONS.md is read by `src/lib.rs`'s version
  # test through `include_str!`).
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rust-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"..."$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|examples/|tests/|benches/|spikes/|build\.rs$|Cargo\.(toml|lock)$|\.cargo/|\.github/workflows/|docs/CONVENTIONS\.md$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "No Rust-relevant changes: the Rust jobs are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  run-tests-rust:
    name: run-tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Build docs
        run: cargo doc --no-deps

  style-checks-rust:
    name: style-checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: stable

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: |
          cargo clippy --no-deps -- -D warnings
          cargo clippy --no-deps --examples -- -D warnings

  run-tests-datagen:
    name: run-tests-datagen
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          components: clippy
          toolchain: stable

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      # Usually 12-20 s. Retries and a short per-request timeout ride out a flaky mirror;
      # the step timeout fails a dead mirror in minutes instead of hanging (2026-11-11: a
      # DNS outage held this step for 7-8 minutes before it failed). Not cached: OpenBLAS
      # sets up libblas.so through update-alternatives in its post-install script, which a
      # restored package cache can miss.
      - name: Install OpenBLAS, FFTW and libclang
        timeout-minutes: 4
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libopenblas-dev libfftw3-dev pkg-config libclang-dev

      - name: Clippy (datagen)
        run: cargo clippy --no-deps --features datagen --all-targets -- -D warnings

      - name: Run tests (datagen)
        run: cargo test --features datagen
