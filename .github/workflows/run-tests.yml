name: 🧪 run-tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  run-tests-rust:
    name: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Build docs
        run: cargo doc --no-deps

  style-checks-rust:
    name: style-checks
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: stable

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: |
          cargo clippy --no-deps -- -D warnings
          cargo clippy --no-deps --examples -- -D warnings

  run-tests-chebyshev:
    name: run-tests-chebyshev
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          components: clippy
          toolchain: stable

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Install OpenBLAS, FFTW and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libfftw3-dev pkg-config libclang-dev

      - name: Clippy (chebyshev)
        run: cargo clippy --no-deps --features chebyshev --all-targets -- -D warnings

      - name: Run tests (chebyshev)
        run: cargo test --features chebyshev
