name: 🧪 run-examples

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-examples:
    name: run-examples
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-templated-examples
        run: cargo install cargo-templated-examples

      # - name: Run examples
        # run: cargo templated-examples
